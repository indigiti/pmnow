name: PMNow Security and Syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, openssl, mbstring

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config public resources/views tools tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php ops/preflight.php

      - name: Cloudways disabled-function compatibility
        shell: bash
        run: |
          set -euo pipefail
          php -d disable_functions=putenv -r 'require "bootstrap/env.php"; pm_env_set("PMNOW_DISABLED_FUNCTION_TEST","ok"); if (pm_env("PMNOW_DISABLED_FUNCTION_TEST") !== "ok") { exit(1); } echo "portable env helper OK\n";'
          php -d disable_functions=putenv -r '$_ENV["APP_ENV"]="production"; $_SERVER["APP_ENV"]="production"; $app=require "bootstrap/app.php"; if (($app["config"]["env"] ?? "") !== "production") { exit(1); } echo "bootstrap without putenv OK\n";'
          php -d disable_functions=putenv -r 'require "bootstrap/env.php"; require "app/Core/Request.php"; pm_env_set("APP_BASE_PATH","/pmnow"); $_SERVER["REQUEST_METHOD"]="GET"; $_SERVER["REQUEST_URI"]="/pmnow/"; $r=\\PuneMirror\\Core\\Request::capture(); if ($r->path !== "/") { fwrite(STDERR,"route=".$r->path."\\n"); exit(1); } echo "subpath routing without putenv OK\\n";'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python checks
        run: |
          python -m pip install --disable-pip-version-check -r engine/requirements.txt
          python -m compileall -q engine
          PYTHONPATH=. python engine/tests/smoke.py
          PYTHONPATH=. python tests/m7_engine_smoke.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: PHP application smoke
        run: |
          cp .env.example .env
          python -m uvicorn engine.main:app --host 127.0.0.1 --port 8788 > /tmp/pmnow-engine.log 2>&1 &
          ENGINE_PID=$!
          trap 'kill $ENGINE_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8788/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8788/health >/dev/null
          php tools/seed.php
          php tests/smoke.php
          php tests/m4_m5_smoke.php
          php tests/m6_smoke.php
          php tests/m7_smoke.php
          rm -f .env

      - name: Build DigiOps split release
        run: |
          bash ops/package-release.sh
          test -f dist/pmnow/public/index.php
          test -f dist/pmnow/private/bootstrap/app.php
          test -f dist/pmnow/SHA256SUMS
          ! find dist/pmnow/private/storage -type f ! -name '.gitkeep' | grep -q .
