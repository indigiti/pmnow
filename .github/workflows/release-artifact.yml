name: PMNow Certified Release Artifact

on:
  workflow_run:
    workflows:
      - PMNow Security and Syntax
    types: [completed]

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Verify certified SHA
        env:
          CERTIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build assets and release payload
        env:
          CERTIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          SOURCE_SHA="$CERTIFIED_SHA" OUTPUT_DIR="$RUNNER_TEMP/pmnow-release" bash ops/package-release.sh
          test -f "$RUNNER_TEMP/pmnow-release/pmnow/public/index.php"
          test -f "$RUNNER_TEMP/pmnow-release/pmnow/private/bootstrap/app.php"
          test -f "$RUNNER_TEMP/pmnow-release/pmnow/SHA256SUMS"

      - name: Upload DigiOps deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: ${{ runner.temp }}/pmnow-release/pmnow/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
